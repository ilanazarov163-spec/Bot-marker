services:
  - type: web
    name: Bot-marker
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "5000"
      - key: TELEGRAM_BOT_TOKEN
        generateValue: true
      - key: TELEGRAM_CHAT_ID
        generateValue: true
      - key: FFMPEG_BINARY
        value: ffmpeg
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_LANGUAGE
        value: ru
