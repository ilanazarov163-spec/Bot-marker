services:
  - type: web
    name: Bot-marker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SECRET_KEY
        value: cs2-clip-maker-secret-key-2024
      - key: DEBUG
        value: False
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5000
      - key: TELEGRAM_BOT_TOKEN
        value: ""
      - key: TELEGRAM_CHAT_ID
        value: ""
      - key: FFMPEG_BINARY
        value: ffmpeg
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_LANGUAGE
        value: ru
